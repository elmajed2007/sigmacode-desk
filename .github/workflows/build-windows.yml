name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Run the local-AI integration test (downloads ~1.3 GB of models)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      SIGMADESK_DATA: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Fetch llama.cpp (Windows CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $rels = gh api "repos/ggml-org/llama.cpp/releases?per_page=10" | ConvertFrom-Json
            $pick = $null
            foreach ($r in $rels) {
              $a = $r.assets | Where-Object { $_.name -match 'bin-win-cpu-x64\.zip$' } | Select-Object -First 1
              if ($a) { $pick = @{ tag = $r.tag_name; asset = $a }; break }
            }
            if (-not $pick) {
              $names = ($rels[0].assets | ForEach-Object { $_.name }) -join ', '
              throw "No win-cpu-x64 asset found. Latest assets: $names"
            }
            Write-Host "llama.cpp $($pick.tag): $($pick.asset.name)"
            Invoke-WebRequest $pick.asset.browser_download_url -OutFile llama.zip
            New-Item -ItemType Directory -Force runtime/llama | Out-Null
            Expand-Archive llama.zip -DestinationPath llama-tmp -Force
            $server = Get-ChildItem llama-tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $server) { throw "llama-server.exe not in $($pick.asset.name)" }
            Copy-Item (Join-Path $server.DirectoryName '*') runtime/llama -Recurse -Force
            "$($pick.tag)" | Out-File runtime/llama/VERSION.txt -Encoding utf8
            $v = & runtime/llama/llama-server.exe --version 2>&1 | Out-String
            Write-Host $v
            Write-Host "::notice::llama.cpp $($pick.tag) ($($pick.asset.name))"
          } catch {
            Write-Host "::error::llama.cpp fetch failed: $($_.Exception.Message)"
            exit 1
          }
          exit 0

      - name: Cache test models
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.integration)
        uses: actions/cache@v5
        with:
          path: ci-data/models
          key: it-models-qwen3-1.7b-v1

      - name: Local AI integration test (llama.cpp + Qwen3)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.integration)
        env:
          SIGMADESK_IT: "1"
        run: python -m pytest -q -s tests/integration

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/sigmadesk.spec

      - name: Bundle llama.cpp runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SigmaCodeDesk/runtime | Out-Null
          Copy-Item runtime/llama dist/SigmaCodeDesk/runtime/llama -Recurse -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist/SigmaCodeDesk/

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:SIGMADESK_DATA = "$PWD\smoke-data"
          $p = Start-Process dist/SigmaCodeDesk/SigmaCodeDesk.exe -ArgumentList '--self-test', "$PWD\tests\fixtures\scan2.pdf" -Wait -PassThru
          $rep = Get-Content smoke-data/selftest.json -Raw -Encoding utf8 -ErrorAction SilentlyContinue
          Write-Host "::notice title=Packaged self-test::exit=$($p.ExitCode) $rep"
          if ($p.ExitCode -ne 0) { Get-Content smoke-data/logs/app.log -ErrorAction SilentlyContinue; Write-Host "::error::self-test failed ($($p.ExitCode)): $(Get-Content smoke-data/selftest.json -Raw -ErrorAction SilentlyContinue)"; exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Arabic.isl"
          if (-not (Test-Path $lang)) { $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Unofficial\Arabic.isl" }
          if (Test-Path $lang) { Copy-Item $lang packaging/Arabic.isl } else {
            try { Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Arabic.isl -OutFile packaging/Arabic.isl } catch { Write-Host "Arabic installer language not available" } }
          $ver = (Select-String -Path app/sigmadesk/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v5
        with:
          name: SigmaCodeDesk-Setup
          path: dist/SigmaCodeDesk-Setup-*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SigmaCodeDesk-Setup-*.exe

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SIGMADESK_DATA: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Fetch llama.cpp (Linux x64 build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r TAG URL < <(gh api "repos/ggml-org/llama.cpp/releases?per_page=10" --jq '[.[] | {t: .tag_name, a: ([.assets[] | select(.name | test("bin-ubuntu-x64\\.(zip|tar\\.gz)$"))][0])} | select(.a != null)][0] | "\(.t) \(.a.browser_download_url)"')
          echo "::notice::llama.cpp $TAG $(basename "$URL")"
          curl -sSL "$URL" -o llama.pkg
          mkdir -p llama-tmp runtime/llama
          case "$URL" in *.zip) unzip -q llama.pkg -d llama-tmp ;; *) tar -xzf llama.pkg -C llama-tmp ;; esac
          BIN=$(find llama-tmp -name llama-server -type f | head -1)
          cp -a "$(dirname "$BIN")"/. runtime/llama/
          echo "$TAG" > runtime/llama/VERSION.txt
          chmod +x runtime/llama/llama-server
          runtime/llama/llama-server --version || true

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/sigmadesk.spec

      - name: Bundle runtime and smoke test
        run: |
          set -euo pipefail
          cp -a runtime dist/SigmaCodeDesk/runtime
          cp THIRD_PARTY_NOTICES.md dist/SigmaCodeDesk/
          SIGMADESK_DATA="$PWD/smoke-data" dist/SigmaCodeDesk/SigmaCodeDesk --self-test "$PWD/tests/fixtures/scan2.pdf" && rc=0 || rc=$?
          echo "::notice title=Linux self-test::exit=$rc $(cat smoke-data/selftest.json 2>/dev/null)"
          dist/SigmaCodeDesk/runtime/llama/llama-server --version 2>&1 | head -3 || true
          exit $rc

      - name: Package tar.gz
        run: |
          set -euo pipefail
          VER=$(sed -n 's/__version__ = "\(.*\)"/\1/p' app/sigmadesk/__init__.py)
          mkdir -p pkg/SigmaCodeDesk-linux
          cp -a dist/SigmaCodeDesk pkg/SigmaCodeDesk-linux/
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/sigmacode-desk.png pkg/SigmaCodeDesk-linux/
          tar -C pkg -czf "dist/SigmaCodeDesk-$VER-linux-x64.tar.gz" SigmaCodeDesk-linux

      - uses: actions/upload-artifact@v5
        with:
          name: SigmaCodeDesk-linux
          path: dist/SigmaCodeDesk-*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SigmaCodeDesk-*-linux-x64.tar.gz
